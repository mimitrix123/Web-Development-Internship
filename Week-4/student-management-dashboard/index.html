<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Student Management Dashboard</h1><p>Add, edit, delete, search and filter student records. Data persists in localStorage.</p></header><section class="panel"><h2 id="formTitle">Add Student</h2><form id="studentForm"><input type="hidden" id="studentId"><label>Name<input id="studentName" required></label><label>Roll No.<input id="rollNo" required></label><label>Course<select id="course"><option>Web Development</option><option>Data Science</option><option>UI/UX Design</option></select></label><label>Marks<input id="marks" type="number" min="0" max="100" required></label><button type="submit" id="submitBtn">Add Student</button><button type="button" id="cancelBtn" hidden>Cancel Edit</button></form></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search by name or roll number"><select id="filter"><option value="all">All courses</option><option>Web Development</option><option>Data Science</option><option>UI/UX Design</option></select></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Roll No.</th><th>Course</th><th>Marks</th><th>Actions</th></tr></thead><tbody id="studentRows"></tbody></table></div><p id="empty" hidden>No students found.</p></section></main><script src="script.js"></script></body></html>
