<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><h1>Registration Form</h1><nav><a href="index.html">Home</a><a href="students.html">Students</a><a href="registration.html">Registration</a></nav></header>
<main class="container"><section class="card"><form action="#" method="post">
<label for="name">Full Name</label><input id="name" name="name" type="text" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required>
<label for="course">Course</label><select id="course" name="course" required><option value="">Select a course</option><option>Web Development</option><option>Python</option><option>Data Analytics</option></select>
<fieldset><legend>Gender</legend><label class="inline"><input type="radio" name="gender" value="female"> Female</label><label class="inline"><input type="radio" name="gender" value="male"> Male</label><label class="inline"><input type="radio" name="gender" value="other"> Other</label></fieldset>
<label class="inline"><input type="checkbox" required> I agree to the terms and conditions.</label>
<button type="submit">Register</button>
</form></section></main>
<footer class="site-footer">Week 1 Practice — Forms</footer>
</body></html>
