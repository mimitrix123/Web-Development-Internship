<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive image gallery with a JavaScript lightbox."><title>Interactive Image Gallery</title><link rel="stylesheet" href="style.css"></head><body><header><p class="eyebrow">WEEK 2 PROJECT</p><h1>Interactive Image Gallery</h1><p>Click any image to open the lightbox. Use Escape or the close button to exit.</p></header><main class="gallery" id="gallery"><button class="gallery-item" data-title="Mountain Landscape"><img src="https://picsum.photos/id/1018/900/650" alt="Mountain landscape"></button><button class="gallery-item" data-title="Forest Road"><img src="https://picsum.photos/id/1040/900/650" alt="Road through a green forest"></button><button class="gallery-item" data-title="Ocean Shore"><img src="https://picsum.photos/id/1015/900/650" alt="Rocky ocean shore"></button><button class="gallery-item" data-title="Desert Dunes"><img src="https://picsum.photos/id/1002/900/650" alt="Desert landscape"></button><button class="gallery-item" data-title="Lake View"><img src="https://picsum.photos/id/1011/900/650" alt="Lake and mountains"></button><button class="gallery-item" data-title="Green Hills"><img src="https://picsum.photos/id/1039/900/650" alt="Green hills under the sky"></button><button class="gallery-item" data-title="Winter Peak"><img src="https://picsum.photos/id/1003/900/650" alt="Snowy mountain peak"></button><button class="gallery-item" data-title="Coastal Cliffs"><img src="https://picsum.photos/id/1016/900/650" alt="Coastal cliffs and water"></button></main><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" aria-hidden="true"><button class="close" id="close" aria-label="Close image preview">&times;</button><figure><img id="lightboxImage" src="" alt=""><figcaption id="caption"></figcaption></figure></div><script src="script.js"></script></body></html>
