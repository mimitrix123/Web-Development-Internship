<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1>Weather App</h1><p>Search a city to see current weather.</p><form id="weatherForm"><label for="city">City name</label><div class="search"><input id="city" required placeholder="e.g. Kolkata"><button>Search</button></div></form><article id="weather" class="card" hidden><h2 id="location"></h2><p class="temp"><span id="temperature"></span>°C</p><p id="condition"></p><p>Humidity: <strong id="humidity"></strong>%</p></article><p id="status" role="status"></p><p class="note">For security, add your OpenWeatherMap API key in <code>script.js</code> before use.</p></main><script src="script.js"></script></body></html>
