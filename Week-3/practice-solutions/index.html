<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 3 JavaScript Practice</title><link rel="stylesheet" href="style.css"></head><body><main><h1>JavaScript Fundamentals</h1><section><h2>1. Even or Odd</h2><input id="number" type="number" placeholder="Enter a number"><button id="checkBtn">Check</button><p id="result"></p></section><section><h2>2. Click to Change Color</h2><button id="colorBtn">Change my color</button></section><section><h2>3. Simple Calculator</h2><input id="a" type="number" placeholder="First number"><select id="operator"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select><input id="b" type="number" placeholder="Second number"><button id="calcBtn">Calculate</button><p id="calcResult"></p></section><section><h2>4. Today's Date</h2><p id="date"></p></section></main><script src="script.js"></script></body></html>
